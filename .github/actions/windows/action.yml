name: "windows"
description: "Build static/dynamic libmpv for Windows (MSVC)"

# Pinned upstream versions — bump these to upgrade.
# vcpkg ref: master branch (FFmpeg 9.0.2)
# mpv / libplacebo: pinned in ports/mpv and ports/libplacebo (overlay ports)
#
# Produces two zips per arch: static_windows and dynamic_windows, both for the
# dynamic CRT (/MD). Dependencies are built with cl.exe; mpv and libplacebo
# don't build with it, so they use clang-cl (same ABI), the way mpv's own
# *-pc-windows-msvc CI builds them.

inputs:
  arch:
    description: "Target architecture (x64 or arm64)"
    required: true

runs:
  using: composite
  steps:
    - name: Install NASM
      uses: ilammy/setup-nasm@v1

    # Restore/save are split (instead of actions/cache) so the cache is saved
    # even when the build fails: otherwise every failed attempt rebuilds all
    # ports from scratch. Keys are per-run because cache entries are immutable.
    - name: Restore vcpkg binaries
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: vcpkg-${{ runner.os }}-${{ inputs.arch }}-windows-master-${{ github.run_id }}
        restore-keys: vcpkg-${{ runner.os }}-${{ inputs.arch }}-windows-master

    - name: Install vcpkg
      shell: bash
      run: |
        mkdir -p $GITHUB_WORKSPACE/static_${{ inputs.arch }}/lib
        mkdir -p $GITHUB_WORKSPACE/dynamic_${{ inputs.arch }}/lib
        mkdir -p $GITHUB_WORKSPACE/vcpkg_cache
        git clone --depth 1 --branch master https://github.com/microsoft/vcpkg builder
        ./builder/bootstrap-vcpkg.sh
        # Build only Release (skip Debug) for every triplet to roughly halve build time.
        find builder/triplets -name '*.cmake' -exec bash -c 'echo "set(VCPKG_BUILD_TYPE release)" >> "$1"' _ {} \;
        # vcpkg's Windows toolchain compiles Release with /Z7, which embeds full
        # debug info in every object, so static .lib files come out 3-5x bigger.
        # Drop it; DLLs still get PDBs, which aren't shipped. Ports that add
        # their own debug flags are handled by the "Strip debug info" step,
        # but that can't process every library (e.g. clang-cl's mpv.lib).
        sed -i '/_FLAGS_RELEASE /s| /Z7 | |' builder/scripts/toolchains/windows.cmake
        if grep -E '_FLAGS_RELEASE .*/Z7' builder/scripts/toolchains/windows.cmake; then
          echo "::error::failed to remove /Z7 from vcpkg's Release flags"
          exit 1
        fi
        # mpv and libplacebo are built with clang-cl; see cmake/clang-cl-toolchain.cmake.
        # It includes vcpkg's stock windows.cmake by relative path, so it lives
        # next to it. With a chainloaded toolchain vcpkg skips the Visual Studio
        # environment (no VCINSTALLDIR, no rc.exe) unless VCPKG_LOAD_VCVARS_ENV is on.
        cp cmake/clang-cl-toolchain.cmake builder/scripts/toolchains/clang-cl.cmake
        CHAINLOAD="$(cygpath -m "$GITHUB_WORKSPACE")/builder/scripts/toolchains/clang-cl.cmake"
        for t in $(find builder/triplets -name '*-windows.cmake' -o -name '*-windows-static-md.cmake'); do
          printf '\nif(PORT MATCHES "^(mpv|libplacebo)$")\n    set(VCPKG_CHAINLOAD_TOOLCHAIN_FILE "%s")\n    set(VCPKG_LOAD_VCVARS_ENV ON)\nendif()\n' "$CHAINLOAD" >> "$t"
        done
        # www.libssh.org has been intermittently unreachable (vcpkg#50969), which
        # aborts the ssh feature's source download ("won't retry"). Pre-seed vcpkg's
        # downloads/ cache with the byte-identical tarball from Debian's mirror;
        # vcpkg re-verifies the SHA512, so this only changes where the bytes come from.
        LIBSSH_VER=$(grep -m1 -oE '"version[^"]*": *"[^"]+"' builder/ports/libssh/vcpkg.json | grep -oE '[0-9]+(\.[0-9]+)+')
        mkdir -p builder/downloads
        curl -fL --connect-timeout 10 --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 \
          -o "builder/downloads/libssh-${LIBSSH_VER}.tar.xz" \
          "https://deb.debian.org/debian/pool/main/libs/libssh/libssh_${LIBSSH_VER}.orig.tar.xz" \
          || echo "::warning::libssh mirror pre-seed failed; vcpkg will fall back to upstream"

    - name: Build libmpv
      shell: bash
      env:
        VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_cache
      run: |
        # Playback-focused FFmpeg: every decoder/demuxer/protocol/hwaccel, but none
        # of the encoder-only libraries (x264, x265, svt-av1, aom, lame, ...).
        # d3d11va/dxva2 are built into FFmpeg on Windows; nvcodec and opengl are
        # unsupported on Windows-ARM.
        BASE="gpl,avcodec,avdevice,avfilter,avformat,swresample,swscale,dav1d,vpx,opus,speex,ilbc,openjpeg,ass,freetype,fontconfig,fribidi,drawtext,iconv,bzip2,lzma,zlib,openssl,xml2,srt,ssh,dvdvideo,snappy,soxr,vulkan"
        if [ "${{ inputs.arch }}" = "x64" ]; then
          FFMPEG="$BASE,opengl,nvcodec"
        else
          FFMPEG="$BASE"
        fi
        ./builder/vcpkg install --overlay-ports=ports "ffmpeg[$FFMPEG]:${{ inputs.arch }}-windows-static-md" "mpv:${{ inputs.arch }}-windows-static-md"
        # --recurse: the dynamic triplet is also the host triplet, so ports
        # already built there as host dependencies may need rebuilding with
        # more features; without --recurse vcpkg refuses and stops.
        ./builder/vcpkg install --recurse --overlay-ports=ports "ffmpeg[$FFMPEG]:${{ inputs.arch }}-windows" "mpv:${{ inputs.arch }}-windows"

    - name: Save vcpkg binaries
      if: always()
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: vcpkg-${{ runner.os }}-${{ inputs.arch }}-windows-master-${{ github.run_id }}

    - name: Prepare binaries
      shell: bash
      run: |
        ST="$GITHUB_WORKSPACE/builder/installed/${{ inputs.arch }}-windows-static-md"
        DY="$GITHUB_WORKSPACE/builder/installed/${{ inputs.arch }}-windows"
        OUT_ST="$GITHUB_WORKSPACE/static_${{ inputs.arch }}"
        OUT_DY="$GITHUB_WORKSPACE/dynamic_${{ inputs.arch }}"

        cp -r "$ST/include" "$OUT_ST/"
        # pkg-config files, relocated so `pkg-config --static --libs mpv` works
        # from wherever the zip is extracted.
        cp -r "$ST/lib/pkgconfig" "$OUT_ST/lib/pkgconfig"
        sed -i 's|^prefix=.*|prefix=${pcfiledir}/../..|' "$OUT_ST"/lib/pkgconfig/*.pc
        # Some C++ ports record the GCC/Clang C++ runtime (-lstdc++/-lc++) in
        # their .pc; with MSVC the C++ runtime comes in through /MD on its own.
        grep -lE '(^|\s)-l(stdc|c)\+\+(\s|$)' "$OUT_ST"/lib/pkgconfig/*.pc | xargs -r -n1 basename | sed 's/^/dropping -lstdc++\/-lc++ from: /' || true
        sed -i -E ':a; s/(^|\s)-l(stdc|c)\+\+(\s|$)/\1\3/; ta' "$OUT_ST"/lib/pkgconfig/*.pc
        # Ship only the libraries libmpv actually links (its `--static` closure),
        # not everything the dependencies installed (e.g. harfbuzz-subset, the
        # extra SPIRV-Tools libraries, abseil). Names that aren't in lib/ are
        # Windows system libraries.
        PKGCONF="$GITHUB_WORKSPACE/builder/installed/${{ inputs.arch }}-windows/tools/pkgconf/pkgconf.exe"
        LIBS=$(PKG_CONFIG_PATH="$OUT_ST/lib/pkgconfig" "$PKGCONF" --static --libs mpv | tr -d '\r' | tr ' ' '\n' \
          | sed -n -e 's/^-l//p' -e 's|^.*/\([^/]*\)\.lib"\{0,1\}$|\1|p' | sort -u)
        for l in $LIBS; do
          [ -f "$ST/lib/$l.lib" ] && cp "$ST/lib/$l.lib" "$OUT_ST/lib/"
        done
        [ -f "$OUT_ST/lib/mpv.lib" ] || { echo "::error::mpv.lib not in pkg-config output"; exit 1; }
        echo "shipping $(ls "$OUT_ST"/lib/*.lib | wc -l) of $(ls "$ST"/lib/*.lib | wc -l) static libraries"
        # Ports that only build as DLLs (e.g. the Vulkan loader, vulkan-1.dll)
        # leave a DLL next to their import library even on the static triplet.
        for dll in "$ST"/bin/*.dll; do
          [ -f "$dll" ] || continue
          cp "$dll" "$OUT_ST/lib/"
          echo "bundled DLL: $(basename "$dll")"
        done

        cp -r "$DY/include" "$OUT_DY/"
        cp "$DY"/bin/*.dll "$OUT_DY/lib/"
        # libmpv's import library, to link with MSVC. The other .lib files are
        # import libraries of its dependencies or static-only ports already
        # linked into the DLLs.
        cp "$DY/lib/mpv.lib" "$OUT_DY/lib/"

    # Dropping /Z7 from vcpkg's toolchain doesn't reach ports that add their
    # own debug flags: FFmpeg's configure (debug is on unless --disable-debug,
    # which vcpkg doesn't pass) and OpenSSL's Configure. Strip the CodeView
    # sections (.debug$S/.debug$T) from the static libraries instead, as
    # binaries-ffmpeg does; the symbol table stays, so they still link.
    - name: Strip debug info
      shell: pwsh
      run: |
        $objcopy = (Get-Command llvm-objcopy -ErrorAction SilentlyContinue).Source
        if (-not $objcopy) { $objcopy = "C:\Program Files\LLVM\bin\llvm-objcopy.exe" }
        if (-not (Test-Path $objcopy)) { choco install llvm -y; $objcopy = "C:\Program Files\LLVM\bin\llvm-objcopy.exe" }
        # llvm-objcopy rejects a few libraries (e.g. import libraries such as
        # vulkan-1.lib): strip into a temp file, swap it in only on success, and
        # keep the others as they are (they still link).
        $ErrorActionPreference = "Continue"
        $PSNativeCommandUseErrorActionPreference = $false
        Get-ChildItem "static_${{ inputs.arch }}/lib" -Filter *.lib | ForEach-Object {
          $src = $_.FullName; $tmp = "$src.stripped"
          & $objcopy --strip-debug $src $tmp 2>$null
          if ($LASTEXITCODE -eq 0 -and (Test-Path $tmp)) {
            Move-Item -Force $tmp $src
          } else {
            if (Test-Path $tmp) { Remove-Item -Force $tmp }
            Write-Host "skip (unsupported by llvm-objcopy): $($_.Name)"
          }
        }
        exit 0

    - name: Set up MSVC tools
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ inputs.arch }}

    # Link a tiny libmpv client against each zip with cl.exe /MD and run it, so
    # a missing library or DLL fails the build instead of reaching a release.
    - name: Smoke test
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $PSNativeCommandUseErrorActionPreference = $true
        $tmp = "$env:RUNNER_TEMP/smoke"
        New-Item -ItemType Directory -Force $tmp | Out-Null
        Set-Content -Encoding ascii "$tmp/test.c" @'
        #include <stdio.h>
        #include <mpv/client.h>

        int main(void) {
            mpv_handle *mpv = mpv_create();
            if (!mpv || mpv_initialize(mpv) < 0)
                return 1;
            printf("libmpv client API %lu\n", mpv_client_api_version());
            mpv_terminate_destroy(mpv);
            return 0;
        }
        '@
        $pkgconf = "builder/installed/${{ inputs.arch }}-windows/tools/pkgconf/pkgconf.exe"

        $st = Resolve-Path "static_${{ inputs.arch }}"
        $env:PKG_CONFIG_PATH = "$st/lib/pkgconfig"
        $cflags = (& $pkgconf --cflags --msvc-syntax mpv) -split '\s+' | Where-Object { $_ }
        $libs = (& $pkgconf --static --libs --msvc-syntax mpv) -split '\s+' | Where-Object { $_ }
        cl /nologo /MD "$tmp/test.c" @cflags /Fo"$tmp/static.obj" /Fe"$tmp/static.exe" /link @libs
        $env:PATH = "$st/lib;$env:PATH"
        & "$tmp/static.exe"

        $dy = Resolve-Path "dynamic_${{ inputs.arch }}"
        cl /nologo /MD "$tmp/test.c" /I"$dy/include" /Fo"$tmp/dynamic.obj" /Fe"$tmp/dynamic.exe" /link /libpath:"$dy/lib" mpv.lib
        $env:PATH = "$dy/lib;$env:PATH"
        & "$tmp/dynamic.exe"

    - name: Zip local
      shell: bash
      run: |
        cd $GITHUB_WORKSPACE/static_${{ inputs.arch }}
        7z a -tzip -mx=9 $GITHUB_WORKSPACE/static_windows_${{ inputs.arch }}.zip include lib

        cd $GITHUB_WORKSPACE/dynamic_${{ inputs.arch }}
        7z a -tzip -mx=9 $GITHUB_WORKSPACE/dynamic_windows_${{ inputs.arch }}.zip include lib

    # On failure, keep vcpkg's per-port logs (plus mpv's ninja files and link
    # response files, which hold the full command lines) for debugging.
    - name: Save build logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: logs-windows-${{ inputs.arch }}
        path: |
          builder/buildtrees/**/*.log
          builder/buildtrees/mpv/*-rel/build.ninja
          builder/buildtrees/mpv/*-rel/*.rsp
          builder/buildtrees/*/*-rel/meson-logs/*.txt
        if-no-files-found: ignore

    - name: Save artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries-windows-${{ inputs.arch }}
        path: "*.zip"
