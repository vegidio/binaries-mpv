name: "linux"
description: "Build static and dynamic libmpv for Linux"

# Pinned upstream versions — bump these to upgrade.
# vcpkg ref: master branch (FFmpeg 9.0.2)
# mpv / libplacebo: pinned in ports/mpv and ports/libplacebo (overlay ports)

inputs:
  arch:
    description: "Target architecture suffix (e.g. x64, arm64)"
    required: true
  triplet:
    description: "vcpkg static triplet (e.g. x64-linux); the dynamic triplet is derived as <triplet>-dynamic"
    required: true

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        sudo apt-get update
        # libva-dev is intentionally NOT installed: vcpkg builds its own libva and
        # we bundle a from-source static copy of the same version (see below). A
        # system libva-dev would shadow it via pkg-config. libdrm-dev stays (vcpkg's
        # libva and mpv need the DRM headers).
        sudo apt-get install -y nasm yasm pkg-config autoconf autoconf-archive automake libtool libltdl-dev libdrm-dev libgl1-mesa-dev meson ninja-build
        # System display/audio stacks mpv links against. These stay dynamic (the
        # GL/EGL driver must be the user's own) and exist on every desktop.
        sudo apt-get install -y \
          libx11-dev libxext-dev libxrandr-dev libxpresent-dev libxss-dev libxfixes-dev \
          libx11-xcb-dev libxcb-dri3-dev libxkbcommon-dev libwayland-dev wayland-protocols \
          libegl-dev libgbm-dev libdisplay-info-dev libvdpau-dev \
          libpulse-dev libpipewire-0.3-dev libasound2-dev
        mkdir -p $GITHUB_WORKSPACE/static_${{ inputs.arch }}/lib
        mkdir -p $GITHUB_WORKSPACE/dynamic_${{ inputs.arch }}/lib
        mkdir -p $GITHUB_WORKSPACE/vcpkg_cache

    - name: Cache vcpkg binaries
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: vcpkg-${{ runner.os }}-${{ inputs.triplet }}-master

    - name: Install vcpkg
      shell: bash
      run: |
        git clone --depth 1 --branch master https://github.com/microsoft/vcpkg builder
        ./builder/bootstrap-vcpkg.sh
        # Build only Release (skip Debug) for every triplet to roughly halve build time.
        find builder/triplets -name '*.cmake' -exec bash -c 'echo "set(VCPKG_BUILD_TYPE release)" >> "$1"' _ {} \;
        # www.libssh.org has been intermittently unreachable (vcpkg#50969), which
        # aborts the ssh feature's source download ("won't retry"). Pre-seed vcpkg's
        # downloads/ cache with the byte-identical tarball from Debian's mirror;
        # vcpkg re-verifies the SHA512, so this only changes where the bytes come from.
        LIBSSH_VER=$(grep -m1 -oE '"version[^"]*": *"[^"]+"' builder/ports/libssh/vcpkg.json | grep -oE '[0-9]+(\.[0-9]+)+')
        mkdir -p builder/downloads
        curl -fL --connect-timeout 10 --max-time 120 --retry 5 --retry-all-errors --retry-delay 3 \
          -o "builder/downloads/libssh-${LIBSSH_VER}.tar.xz" \
          "https://deb.debian.org/debian/pool/main/libs/libssh/libssh_${LIBSSH_VER}.orig.tar.xz" \
          || echo "::warning::libssh mirror pre-seed failed; vcpkg will fall back to upstream"

    - name: Build libmpv
      shell: bash
      env:
        VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_cache
      run: |
        # Playback-focused FFmpeg: every decoder/demuxer/protocol/hwaccel, but none
        # of the encoder-only libraries (x264, x265, svt-av1, aom, lame, ...).
        # rubberband/modplug/openmpt are omitted because their ports fail to build.
        BASE="gpl,avcodec,avdevice,avfilter,avformat,swresample,swscale,dav1d,vpx,opus,speex,ilbc,openjpeg,ass,freetype,fontconfig,fribidi,drawtext,iconv,bzip2,lzma,zlib,openssl,xml2,srt,ssh,dvdvideo,snappy,soxr"
        FFMPEG="$BASE,vulkan,opengl,vaapi,nvcodec,alsa"
        ./builder/vcpkg install --overlay-ports=ports "ffmpeg[$FFMPEG]:${{ inputs.triplet }}" "mpv:${{ inputs.triplet }}"
        ./builder/vcpkg install --overlay-ports=ports "ffmpeg[$FFMPEG]:${{ inputs.triplet }}-dynamic" "mpv:${{ inputs.triplet }}-dynamic"

    - name: Build static libva + libdrm
      shell: bash
      run: |
        # vcpkg does NOT leave a static libva.a to bundle (and libdrm isn't a vcpkg
        # port at all), so the static FFmpeg/libmpv archives would have dangling
        # va*/drm* refs. Build both from source as static into a private prefix and
        # bundle them. The .a files only record UNVERSIONED undefined symbols, so a
        # from-source libva of the SAME version they compiled against resolves them.
        # The libva version is read from vcpkg's port so the two always match.
        DRM_VERSION=2.4.124
        VA_VERSION=$(grep -m1 -oE '"version[^"]*": *"[^"]+"' builder/ports/libva/vcpkg.json | grep -oE '[0-9]+(\.[0-9]+)+')
        PREFIX=$GITHUB_WORKSPACE/valibs

        # libdrm (core only; not a vcpkg port)
        curl -fsSL "https://dri.freedesktop.org/libdrm/libdrm-${DRM_VERSION}.tar.xz" -o /tmp/libdrm.tar.xz
        mkdir -p /tmp/libdrm-src
        tar -xf /tmp/libdrm.tar.xz -C /tmp/libdrm-src --strip-components=1
        meson setup /tmp/libdrm-src/build /tmp/libdrm-src \
          --prefix="$PREFIX" --libdir=lib --buildtype=release --default-library=static \
          -Dintel=disabled -Dradeon=disabled -Damdgpu=disabled -Dnouveau=disabled \
          -Dvmwgfx=disabled -Detnaviv=disabled -Dfreedreno=disabled -Dvc4=disabled \
          -Domap=disabled -Dexynos=disabled -Dtegra=disabled -Dvalgrind=disabled \
          -Dman-pages=disabled -Dtests=false
        ninja -C /tmp/libdrm-src/build install

        # libva (+ libva-drm, libva-x11, libva-wayland: mpv uses all three);
        # finds our static libdrm via PKG_CONFIG_PATH. va/meson.build hard-codes
        # shared_library() (ignoring --default-library), so it would only emit
        # libva.so. Rewrite those to meson's library() wrapper, which honors
        # --default-library=static while still accepting the shared-only
        # version/soversion/vs_module_defs kwargs.
        curl -fsSL "https://github.com/intel/libva/archive/refs/tags/${VA_VERSION}.tar.gz" -o /tmp/libva.tar.gz
        mkdir -p /tmp/libva-src
        tar -xf /tmp/libva.tar.gz -C /tmp/libva-src --strip-components=1
        sed -i 's/shared_library(/library(/g' /tmp/libva-src/va/meson.build
        PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig" meson setup /tmp/libva-src/build /tmp/libva-src \
          --prefix="$PREFIX" --libdir=lib --buildtype=release --default-library=static \
          -Dwith_x11=yes -Dwith_wayland=yes -Dwith_glx=no
        ninja -C /tmp/libva-src/build install

    - name: Prepare binaries
      shell: bash
      run: |
        ST=$GITHUB_WORKSPACE/builder/installed/${{ inputs.triplet }}
        DY=$GITHUB_WORKSPACE/builder/installed/${{ inputs.triplet }}-dynamic
        OUT_ST=$GITHUB_WORKSPACE/static_${{ inputs.arch }}
        OUT_DY=$GITHUB_WORKSPACE/dynamic_${{ inputs.arch }}

        cp -r $ST/include $OUT_ST/include
        cp $ST/lib/*.a $OUT_ST/lib/
        # Bundle the from-source static VA-API stack so the consumer resolves the
        # va*/drm* refs with nothing extra on the system.
        cp $GITHUB_WORKSPACE/valibs/lib/libva*.a $GITHUB_WORKSPACE/valibs/lib/libdrm.a $OUT_ST/lib/
        # pkg-config files, relocated so `pkg-config --static --libs mpv` works
        # from wherever the zip is extracted.
        cp -r $ST/lib/pkgconfig $OUT_ST/lib/pkgconfig
        sed -i 's|^prefix=.*|prefix=${pcfiledir}/../..|' $OUT_ST/lib/pkgconfig/*.pc
        # Strip DWARF debug info from the static .a files (it's ~90% of their size
        # and is not needed to link against them). --strip-debug keeps the symbol
        # table, so the libraries still link; native strip matches the runner arch.
        strip --strip-debug $OUT_ST/lib/*.a

        cp -r $DY/include $OUT_DY/include
        cp -a $DY/lib/*.so* $OUT_DY/lib/
        # Every bundled .so must find its siblings via $ORIGIN.
        for so in $OUT_DY/lib/*.so*; do
          [ -L "$so" ] && continue
          readelf -d "$so" | grep -qE 'R(UN)?PATH.*\$ORIGIN' || echo "::warning::no \$ORIGIN rpath in $(basename "$so")"
        done

    - name: Zip local
      shell: bash
      run: |
        cd $GITHUB_WORKSPACE/static_${{ inputs.arch }}
        7z a -tzip -mx=9 $GITHUB_WORKSPACE/static_linux_${{ inputs.arch }}.zip include lib

        cd $GITHUB_WORKSPACE/dynamic_${{ inputs.arch }}
        # -snl: store the .so SONAME symlinks as links. Without it, 7-Zip 23.01 on
        # the Linux runner follows them and stores three full copies of every shared
        # library, ~tripling the archive.
        7z a -tzip -mx=9 -snl $GITHUB_WORKSPACE/dynamic_linux_${{ inputs.arch }}.zip include lib

    - name: Save artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries-linux-${{ inputs.arch }}
        path: "*.zip"
